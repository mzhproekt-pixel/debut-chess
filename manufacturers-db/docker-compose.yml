services:
  postgres:
    image: postgres:16-alpine
    container_name: mdb-postgres
    environment:
      POSTGRES_USER: mdb
      POSTGRES_PASSWORD: mdb
      POSTGRES_DB: manufacturers
    ports:
      - "5432:5432"
    volumes:
      - mdb_pg_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdb -d manufacturers"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: mdb-adminer
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  mdb_pg_data:
